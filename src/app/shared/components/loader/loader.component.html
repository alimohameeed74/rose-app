@if (loadingService.isLoading()) {
  <div class="fixed inset-0 z-9999 flex flex-col items-center justify-center bg-black/80 gap-3">
    <div class="flex flex-col items-center gap-1">
      <p-progress-spinner strokeWidth="2" ariaLabel="loading"></p-progress-spinner>
      <span class="text-xs mt-8 font-semibold text-white tracking-wide">
        Loading your profile, please wait...
      </span>
    </div>
  </div>
}
