<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="true"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '400px' }"
  (onHide)="closeDialog()"
>
  <ng-template #header>
    <span class="text-(--mode-color) font-bold text-2xl"> Delete Account </span>
  </ng-template>

  <div class="flex flex-col items-center gap-4 text-center">
    <i class="pi pi-exclamation-triangle text-5xl text-red-500"></i>

    <p class="text-(--mode-color) font-medium">
      Are you sure you want to delete your account? This action cannot be undone.
    </p>

    <div class="flex w-full gap-3">
      <button
        (click)="deleteAccount()"
        [disabled]="isLoading()"
        type="button"
        pButton
        class="flex-1 font-medium"
      >
        <span class="font-medium">
          @if (isLoading()) {
            <i class="pi pi-spin pi-spinner"></i>
          }
          Yes, Delete</span
        >
      </button>

      <button
        (click)="closeDialog()"
        type="button"
        pButton
        class="flex-1 font-medium"
        severity="secondary"
        outlined
      >
        <span class="font-medium">No, Cancel</span>
      </button>
    </div>
  </div>
</p-dialog>
