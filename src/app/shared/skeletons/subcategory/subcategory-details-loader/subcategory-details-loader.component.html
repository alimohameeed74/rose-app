<p-card styleClass="overflow-hidden rounded-2xl">
  <div class="flex flex-col gap-6">
    <!-- Subcategory Skeleton -->
    <div class="flex flex-col gap-5 sm:flex-row sm:items-start">
      <!-- Image -->
      <div class="h-48 w-full shrink-0 overflow-hidden rounded-xl sm:w-56">
        <p-skeleton width="100%" height="100%" borderRadius="0.75rem" />
      </div>

      <!-- Subcategory Information -->
      <div class="flex min-w-0 flex-1 flex-col gap-4 py-1">
        <!-- Title and Status -->
        <div class="flex flex-wrap items-center justify-between gap-3">
          <p-skeleton width="12rem" height="2rem" />
          <p-skeleton width="5.5rem" height="1.5rem" borderRadius="1rem" />
        </div>

        <!-- Description -->
        <div class="space-y-2">
          <p-skeleton width="100%" height="0.875rem" />
          <p-skeleton width="90%" height="0.875rem" />
          <p-skeleton width="65%" height="0.875rem" />
        </div>

        <!-- Dates -->
        <div class="mt-auto grid grid-cols-1 gap-3 sm:grid-cols-2">
          @for (item of [1, 2]; track item) {
            <div class="flex items-center gap-3 rounded-xl border border-(--surface-border) p-3">
              <p-skeleton size="2rem" borderRadius="0.5rem" />

              <div class="flex min-w-0 flex-1 flex-col gap-2">
                <p-skeleton width="5rem" height="0.75rem" />
                <p-skeleton width="7rem" height="1rem" />
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <!-- Parent Category Skeleton -->
    <div class="border-t border-(--surface-border) pt-5">
      <!-- Section Title -->
      <div class="mb-4 flex items-center gap-2">
        <p-skeleton size="1.25rem" borderRadius="0.25rem" />
        <p-skeleton width="9rem" height="1.25rem" />
      </div>

      <!-- Parent Category Information -->
      <div
        class="flex flex-col gap-4 rounded-xl border border-(--surface-border) bg-(--surface-ground) p-4 sm:flex-row sm:items-center"
      >
        <!-- Category Image -->
        <p-skeleton size="4rem" borderRadius="0.75rem" />

        <!-- Category Details -->
        <div class="flex min-w-0 flex-1 flex-col gap-3">
          <!-- Title and Status -->
          <div class="flex flex-wrap items-center gap-2">
            <p-skeleton width="8rem" height="1.25rem" />
            <p-skeleton width="5.5rem" height="1.5rem" borderRadius="1rem" />
          </div>

          <!-- Description -->
          <div class="space-y-2">
            <p-skeleton width="100%" height="0.75rem" />
            <p-skeleton width="75%" height="0.75rem" />
          </div>
        </div>

        <!-- Creation Date -->
        <div
          class="flex shrink-0 items-center gap-2 sm:border-s sm:border-(--surface-border) sm:ps-4"
        >
          <p-skeleton size="1.5rem" borderRadius="50%" />

          <div class="flex flex-col gap-2">
            <p-skeleton width="4.5rem" height="0.75rem" />
            <p-skeleton width="6rem" height="1rem" />
          </div>
        </div>
      </div>
    </div>
  </div>
</p-card>
