<p-card styleClass="overflow-hidden border-0 shadow-none">
  <!-- Product Image Skeleton -->
  <div class="relative overflow-hidden rounded-2xl">
    <p-skeleton width="100%" height="18.75rem" />
  </div>

  <!-- Product Details Skeleton -->
  <div class="relative flex flex-col gap-3 px-1 pb-2 pt-5">
    <!-- Title -->
    <p-skeleton width="85%" height="1.75rem" />

    <!-- Rating -->
    <div class="flex items-center gap-1">
      @for (star of [1, 2, 3, 4, 5]; track star) {
        <p-skeleton shape="rectangle" size="1.25rem" />
      }
    </div>

    <!-- Price -->
    <div class="flex items-center gap-2 pe-14">
      <p-skeleton width="6rem" height="1.5rem" />
      <p-skeleton width="5rem" height="1.25rem" />
    </div>

    <!-- Add to Cart Skeleton -->
    <p-skeleton shape="rectangle" size="2rem" styleClass="absolute bottom-0 inset-e-0" />
  </div>
</p-card>
