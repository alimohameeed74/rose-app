<article
  class="flex flex-col gap-3 mb-3 p-3 sm:flex-row sm:items-center border border-(--placeholder) rounded-md"
>
  <!-- Product Image -->
  <p-skeleton width="6rem" height="6rem" borderRadius="0.375rem" styleClass="shrink-0" />

  <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
    <!-- Product Info -->
    <div class="flex items-start justify-between gap-3">
      <div class="flex flex-1 flex-col gap-2">
        <p-skeleton width="70%" height="1rem" />

        <div class="flex items-center gap-2">
          <p-skeleton shape="circle" size="0.8rem" />
          <p-skeleton width="5rem" height="0.75rem" />
          <p-skeleton width="4rem" height="0.75rem" />
        </div>
      </div>

      <!-- Remove Button -->
      <p-skeleton width="2rem" height="2rem" borderRadius="0.375rem" />
    </div>

    <!-- Price & Quantity -->
    <div class="flex flex-wrap items-center justify-between gap-3">
      <!-- Price -->
      <div class="flex items-center gap-2">
        <p-skeleton width="2rem" height="0.75rem" />
        <p-skeleton width="5rem" height="1.5rem" />
        <p-skeleton width="4rem" height="1.25rem" />
      </div>

      <!-- Quantity -->
      <div class="flex items-center gap-1">
        <p-skeleton width="2rem" height="2rem" borderRadius="0.375rem" />
        <p-skeleton width="3.5rem" height="2rem" borderRadius="0.375rem" />
        <p-skeleton width="2rem" height="2rem" borderRadius="0.375rem" />
      </div>
    </div>
  </div>
</article>
