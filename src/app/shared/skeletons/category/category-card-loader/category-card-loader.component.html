<p-card>
  <ng-template #header>
    <div class="mb-4 h-48 overflow-hidden rounded-xl">
      <p-skeleton width="100%" height="12rem" />
    </div>
  </ng-template>

  <ng-template #subtitle>
    <div class="flex flex-col gap-2">
      <p-skeleton width="100%" height="0.875rem" />
      <p-skeleton width="75%" height="0.875rem" />
    </div>
  </ng-template>

  <div class="my-3 flex flex-wrap items-center gap-4 pt-4">
    <div class="flex items-center gap-2">
      <p-skeleton shape="circle" size="1rem" />
      <p-skeleton width="6rem" height="0.875rem" />
    </div>

    <div class="flex items-center gap-2">
      <p-skeleton shape="circle" size="1rem" />
      <p-skeleton width="4rem" height="0.875rem" />
    </div>
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-between gap-3 border-t pt-3">
      <p-skeleton width="6rem" height="0.75rem" />

      <p-skeleton width="7.5rem" height="2.5rem" borderRadius="0.5rem" />
    </div>
  </ng-template>
</p-card>
