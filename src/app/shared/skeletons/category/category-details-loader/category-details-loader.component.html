<p-card styleClass="overflow-hidden rounded-2xl">
  <div class="grid grid-cols-1 gap-6 md:grid-cols-[260px_1fr] md:gap-8">
    <!-- Image Skeleton -->
    <div class="h-56 overflow-hidden rounded-xl md:h-full md:min-h-64">
      <p-skeleton width="100%" height="100%" borderRadius="0.75rem" />
    </div>

    <!-- Category Information Skeleton -->
    <div class="flex min-w-0 flex-col justify-center gap-5 py-1">
      <!-- Title and Status -->
      <div class="space-y-3">
        <div class="flex flex-wrap items-center gap-3">
          <p-skeleton width="14rem" height="2rem" />
          <p-skeleton width="5rem" height="1.5rem" borderRadius="1rem" />
        </div>

        <!-- Description -->
        <div class="space-y-2">
          <p-skeleton width="100%" height="0.875rem" />
          <p-skeleton width="90%" height="0.875rem" />
          <p-skeleton width="65%" height="0.875rem" />
        </div>
      </div>

      <!-- Statistics Skeletons -->
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <!-- Subcategories -->
        <div
          class="flex items-center gap-4 rounded-xl border border-(--surface-border) bg-(--surface-ground) p-4"
        >
          <p-skeleton size="3rem" borderRadius="0.75rem" />

          <div class="flex flex-1 flex-col gap-2">
            <p-skeleton width="2rem" height="1.5rem" />
            <p-skeleton width="6rem" height="0.75rem" />
          </div>
        </div>

        <!-- Creation Date -->
        <div
          class="flex items-center gap-4 rounded-xl border border-(--surface-border) bg-(--surface-ground) p-4"
        >
          <p-skeleton size="3rem" borderRadius="0.75rem" />

          <div class="flex flex-1 flex-col gap-2">
            <p-skeleton width="7rem" height="1rem" />
            <p-skeleton width="5rem" height="0.75rem" />
          </div>
        </div>
      </div>
    </div>
  </div>
</p-card>
