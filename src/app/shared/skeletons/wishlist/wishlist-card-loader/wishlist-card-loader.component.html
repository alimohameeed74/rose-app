<article
  class="flex flex-col mb-2 gap-4 border border-(--placeholder) px-4 rounded-md py-4 sm:flex-row sm:items-start sm:gap-5"
>
  <!-- Image -->
  <div class="h-28 w-28 shrink-0 overflow-hidden rounded-md sm:h-32 sm:w-32">
    <p-skeleton width="100%" height="100%" />
  </div>

  <!-- Details -->
  <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
    <div class="flex flex-col gap-2">
      <!-- Stock -->
      <p-skeleton width="5rem" height="0.75rem" />

      <!-- Title -->
      <p-skeleton width="70%" height="1.25rem" />

      <!-- Rating -->
      <div class="mt-1 flex items-center gap-2">
        <p-skeleton width="3.5rem" height="1.25rem" borderRadius="4px" />

        <p-skeleton width="5rem" height="0.75rem" />
      </div>
    </div>

    <!-- Price -->
    <div class="flex flex-wrap items-center gap-2">
      <p-skeleton width="6rem" height="1.5rem" />

      <p-skeleton width="5rem" height="1.25rem" />
    </div>
  </div>

  <!-- Remove Button -->
  <div class="flex justify-end sm:self-start">
    <p-skeleton width="2.5rem" height="2.5rem" borderRadius="8px" />
  </div>
</article>
