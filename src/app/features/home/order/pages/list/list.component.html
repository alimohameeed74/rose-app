<section class="text-(--mode-color) transition-colors">
  <h1 class="text-4xl font-bold text-(--mode-color) mb-4">Orders</h1>

  <div class="flex flex-col gap-4">
    @if (isLoading()) {
      <app-order-card-skeleton></app-order-card-skeleton>
    } @else {
      <!-- Order Card -->
      @for (order of orders(); track order.id) {
        <app-order-card [order]="order"></app-order-card>
      } @empty {
        <div class="w-full flex flex-col items-center justify-center py-16 text-center">
          <i class="pi pi-exclamation-circle text-4xl! text-(--placeholder)! mb-4"></i>
          <h3 class="text-lg font-semibold text-(--mode-color)">No Orders found</h3>
        </div>
      }
    }
  </div>
</section>
