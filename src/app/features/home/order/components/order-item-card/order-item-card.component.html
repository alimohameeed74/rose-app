<div
  class="flex items-center gap-3 p-2.5 rounded-lg bg-zinc-50 dark:bg-zinc-800/70 border border-zinc-100 dark:border-zinc-700/60"
>
  <img
    [src]="orderItem().product.cover"
    [alt]="orderItem().product.title"
    class="w-16 h-16 rounded-md object-cover shrink-0 bg-zinc-200 dark:bg-zinc-700"
  />

  <div class="min-w-0 flex-1 space-y-1">
    <h3 class="text-sm font-semibold truncate">{{ orderItem().product.title }}</h3>

    <div class="text-xs pt-0.5">
      <span class="text-(--primary-color) font-semibold">(x{{ orderItem().quantity }})</span>
      <span class="text-base font-bold ml-1">{{ orderItem().price | currency: 'EGP' }}</span>
    </div>
  </div>
</div>
