<p-card styleClass="overflow-hidden">
  <div class="mb-4 h-36 overflow-hidden rounded-xl">
    <img
      [src]="subcategory().image ?? 'logo.ico'"
      [alt]="subcategory().title"
      class="h-full w-full object-cover transition-transform duration-300 hover:scale-105"
    />
  </div>

  <ng-template #title>
    <h3 class="text-base font-semibold text-(--mode-color)">
      {{ subcategory().title }}
    </h3>
  </ng-template>

  <ng-template #subtitle>
    <p class="line-clamp-1 text-sm leading-6 text-(--placeholder)">
      {{ subcategory().description || 'Explore this flower collection.' }}
    </p>
  </ng-template>

  <div class="mt-3 flex items-center gap-2">
    <i class="pi pi-calendar text-sm text-(--primary-color)"></i>
    <span class="text-xs text-(--placeholder)">
      Added {{ subcategory().createdAt | date: 'mediumDate' }}
    </span>
  </div>

  <ng-template #footer>
    <div class="flex items-center justify-between gap-2 border-t border-(--surface-border) pt-3">
      <p-tag
        [value]="subcategory().immutable ? 'Immutable' : 'Editable'"
        [severity]="subcategory().immutable ? 'warn' : 'success'"
      />

      <button
        pButton
        type="button"
        (click)="goToDetails(subcategory().id)"
        label="View Details"
        icon="pi pi-arrow-right"
        iconPos="right"
        size="small"
      ></button>
    </div>
  </ng-template>
</p-card>
