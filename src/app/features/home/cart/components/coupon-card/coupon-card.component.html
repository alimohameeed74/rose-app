<div class="flex flex-col gap-3 rounded-lg border border-(--placeholder) p-4">
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-bold text-green-600">{{ coupon().value }}% OFF</h3>

    <span class="text-xs text-green-600">Active</span>
  </div>

  <div class="flex flex-col gap-2 text-sm text-(--placeholder)">
    <div class="flex justify-between">
      <span>Coupon Code</span>
      <span class="font-semibold">{{ coupon().code }}</span>
    </div>

    <div class="flex justify-between">
      <span>Minimum Purchase</span>
      <span>{{ coupon().minPurchase | currency: 'EGP' }}</span>
    </div>

    <div class="flex justify-between">
      <span>Maximum Discount</span>
      <span>{{ coupon().maxDiscount | currency: 'EGP' }}</span>
    </div>
    <div class="flex justify-between">
      <span>From</span>
      <span>{{ coupon().validFrom | date }}</span>
    </div>
    <div class="flex justify-between">
      <span>To</span>
      <span>{{ coupon().validUntil | date }}</span>
    </div>
  </div>

  <button (click)="applyCoupon(coupon().value)" pButton type="button" class="w-full font-medium">
    Apply Coupon
  </button>
</div>
